name: amd64 installer shell checks

on:
  pull_request:
    paths:
      - ".github/workflows/amd64-installer.yml"
      - "distrib/amd64/installer/install.sh"
      - "distrib/amd64/installimage/setup-amd64.sh"
      - "releasetools/x86_64_uefi_cdimage.sh"
      - "minix/fs/mfs/mfs4_runtime.c"
      - "minix/fs/mfs/tests/check_mfs4_super_probe.py"
  push:
    branches:
      - master
    paths:
      - "distrib/amd64/installer/install.sh"
      - "distrib/amd64/installimage/setup-amd64.sh"
      - "releasetools/x86_64_uefi_cdimage.sh"
      - "minix/fs/mfs/mfs4_runtime.c"
      - "minix/fs/mfs/tests/check_mfs4_super_probe.py"

jobs:
  installer-shell-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX shell syntax
        run: |
          sh -n distrib/amd64/installer/install.sh
          sh -n distrib/amd64/installimage/setup-amd64.sh
          bash -n releasetools/x86_64_uefi_cdimage.sh
      - name: Check MFS3 and default MFS4 paths
        run: |
          grep -Fq 'Filesystem format: (4) MFS4 or (3) MFS3 [4]' distrib/amd64/installer/install.sh
          grep -Fq 'Filesystem format: (4) MFS4 or (3) MFS3 [4]' distrib/amd64/installimage/setup-amd64.sh
          grep -Fq 'mkfs.mfs -V 4 -f' distrib/amd64/installer/install.sh
          grep -Fq 'mkfs.mfs -V 3' distrib/amd64/installer/install.sh
          grep -Fq 'mkfs.mfs -V 4 -f' distrib/amd64/installimage/setup-amd64.sh
          grep -Fq 'mkfs.mfs -V 3' distrib/amd64/installimage/setup-amd64.sh

      - name: Check that the installer ISO refreshes the MFS server release set
        run: |
          grep -Fq 'case "${CREATE_IMAGE_ONLY}" in' releasetools/x86_64_uefi_cdimage.sh
          grep -Fq 'sh "${BUILDSH}" -j "${JOBS}" -m "${ARCH}"' releasetools/x86_64_uefi_cdimage.sh
          grep -Fq ' -U -u release' releasetools/x86_64_uefi_cdimage.sh
          grep -Fq 'mounted MFS$MFS_VERSION root at $ROOT is not a directory' distrib/amd64/installer/install.sh

      - name: Check MFS4 superblock detection does not fall back to MFS3
        run: |
          python3 minix/fs/mfs/tests/check_mfs4_super_probe.py
